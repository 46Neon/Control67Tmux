name: Milena CI - Debian proot ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control67-proot-main
  cancel-in-progress: false

jobs:
  milena-proot:
    runs-on: [self-hosted, linux, ARM64, milena-proot]
    timeout-minutes: 45
    steps:
      - name: Checkout Control67Tmux
        uses: actions/checkout@v4

      - name: Validate Milena, cppcheck and diagnostics
        env:
          CONTROL67_ARTIFACT_DIR: ${{ runner.temp }}/control67-artifacts
          CONTROL67_RUN_BENCHMARKS: '0'
        run: bash scripts/validate-proot.sh

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control67-proot-${{ github.run_id }}
          path: ${{ runner.temp }}/control67-artifacts
          if-no-files-found: warn
