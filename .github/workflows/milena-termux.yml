name: Milena CI - Termux nativo ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control67-termux-main
  cancel-in-progress: false

jobs:
  milena-termux:
    runs-on: [self-hosted, linux, ARM64, milena-termux]
    timeout-minutes: 30
    steps:
      - name: Checkout Control67Tmux
        uses: actions/checkout@v4

      - name: Validate Milena nativamente en Termux
        env:
          CONTROL67_ARTIFACT_DIR: ${{ runner.temp }}/control67-artifacts-termux
        run: bash scripts/validate-termux.sh

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control67-termux-${{ github.run_id }}
          path: ${{ runner.temp }}/control67-artifacts-termux
          if-no-files-found: warn
