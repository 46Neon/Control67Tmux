name: Milena CI - Termux nativo ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control67-termux-main
  cancel-in-progress: false

jobs:
  milena-termux:
    runs-on: [self-hosted, linux, ARM64, milena-termux]
    timeout-minutes: 30
    steps:
      - name: Checkout Control67Tmux
        uses: actions/checkout@v4

      - name: Preflight
        run: bash scripts/runner-preflight.sh termux

      - name: Validate Milena nativamente en Termux
        run: bash scripts/termux-native.sh

      - name: Collect diagnostics on failure
        if: failure()
        run: bash scripts/collect-diagnostics.sh || true
